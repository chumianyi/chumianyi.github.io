  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --m3-surface: #fff8f8;
      --m3-on-surface: #201a1b;
      --m3-primary: #8f4a5d;
      --m3-primary-container: #ffd9e2;
      --m3-on-surface-variant: #524345;
      --m3-outline-variant: #d5c2c5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --m3-surface: #1b1113;
        --m3-on-surface: #f0dee0;
        --m3-primary: #ffb1c5;
        --m3-primary-container: #723345;
        --m3-on-surface-variant: #d5c2c5;
        --m3-outline-variant: #524345;
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--m3-surface);
      color: var(--m3-on-surface);
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: var(--m3-surface);
      z-index: 2;
      transition: opacity 420ms ease, visibility 420ms ease;
    }

    #boot.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      padding: 4px;
      background: var(--m3-primary-container);
      object-fit: cover;
    }

    .boot-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .boot-sub {
      margin: 0;
      font-size: 13px;
      color: var(--m3-on-surface-variant);
    }

    .boot-spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid var(--m3-outline-variant);
      border-top-color: var(--m3-primary);
      animation: boot-spin 900ms linear infinite;
      margin-top: 4px;
    }

    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-spinner { animation-duration: 2400ms; }
    }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <img class="boot-avatar" src="boot-avatar.webp" alt="小鸟游星野头像">
    <p class="boot-title">小鸟游星野 · YueWuBot</p>
    <p class="boot-sub">正在准备 Material 3 界面…</p>
    <div class="boot-spinner" aria-hidden="true"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.classList.add('hide');
    });
    // 兜底：万一 first-frame 事件没有触发，也别让加载层一直挡着。
    setTimeout(function () {
      var boot = document.getElementById('boot');
      if (boot && getComputedStyle(boot).visibility !== 'hidden') {
        boot.classList.add('hide');
      }
    }, 15000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
